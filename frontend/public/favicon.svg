<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="finBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#34d399" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10b981" stopOpacity="0.2" />
      <stop offset="100%" stopColor="#06b6d4" stopOpacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#finBg)" stroke="#334155" stroke-width="2" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glowGrad)" />

  <!-- Financial Chart Bars -->
  <rect x="14" y="38" width="6" height="14" rx="3" fill="#334155" />
  <rect x="24" y="30" width="6" height="22" rx="3" fill="#0ea5e9" opacity="0.8" />
  <rect x="34" y="24" width="6" height="28" rx="3" fill="#10b981" opacity="0.9" />
  <rect x="44" y="16" width="6" height="36" rx="3" fill="#34d399" />

  <!-- Upward Trend Line & Arrow -->
  <path 
    d="M 12 40 Q 26 36 34 26 T 50 14" 
    fill="none" 
    stroke="url(#chartGrad)" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Arrow Head -->
  <path 
    d="M 42 14 H 50 V 22" 
    fill="none" 
    stroke="#34d399" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Pulsing Peak Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#ffffff" />
</svg>